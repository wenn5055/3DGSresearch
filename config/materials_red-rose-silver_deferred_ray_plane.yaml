# Same geometry-consistency experiment with ray-plane depth.
# Growth/pruning settings match the centre-depth preset; final 10k steps are fixed.
paths:
  data: ../data/materials_red-rose-silver
  output: ../outputs/materials-red-rose-silver-ray-plane/model.png
runtime: {arch: gpu, seed: 7}
model: {width: 400, height: 400, capacity: 200000, initial_splats: 1000, background: white}
training: {iterations: 30000}
learning_rates: {position_max_steps: 30000}
loss: {dssim_weight: 0.2}
densification: {interval: 100, fraction: 0.2, opacity_reset_interval: 3000}
convergence: {enabled: false}
reporting: {snapshot_every: 1000}
surfel:
  mode: deferred
  depth_mode: ray_plane
  photometric_loss: l1_dssim
  specular_start_iteration: 3000
  initial_reflection: 0.001
  reflection_lr: 0.006
  environment_lr: 0.05
  refinement: {start_iteration: 20001, prune_interval: 0}
  normal_propagation: {enabled: false}
geometry_loss: {mask_weight: 0.1, normal_depth_weight: 0.01}
