# Matched late-SH geometry test: only normal-depth coefficient changes to 0.01.
paths:
  data: ../data/materials_red-rose-silver
  output: ../outputs/materials-red-rose-silver-deferred-consistency-sh3/model.png
runtime:
  arch: gpu
  seed: 7
model:
  width: 400
  height: 400
  capacity: 200000
  initial_splats: 1000
  background: white
  sh_degree: 3
training:
  iterations: 30000
learning_rates:
  position_max_steps: 30000
  feature_rest: 0.000125
loss:
  dssim_weight: 0.2
densification:
  interval: 100
  fraction: 0.2
  opacity_reset_interval: 3000
convergence:
  enabled: false
reporting:
  snapshot_every: 5000
surfel:
  mode: deferred
  photometric_loss: l1_dssim
  specular_start_iteration: 3000
  initial_reflection: 0.001
  reflection_lr: 0.006
  environment_lr: 0.05
  refinement:
    start_iteration: 20001
    prune_interval: 500
  foreground_pruning:
    enabled: true
  normal_propagation:
    enabled: false
  sh_start_iteration: 20001
  sh_band_interval: 2000
geometry_loss:
  mask_weight: 0.1
  normal_depth_weight: 0.01
