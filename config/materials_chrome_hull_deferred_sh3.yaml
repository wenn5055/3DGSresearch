# Training-alpha visual-hull initialization; no mesh/reference training inputs.
# Mirror diagnostic: matched ray-plane/normal-consistency policy, early reflection.
adaptive:
  dssim_psnr_threshold: 21.0
convergence:
  enabled: false
densification:
  fraction: 0.2
  interval: 100
  child_optimizer_state: fresh_children
learning_rates:
  position_max_steps: 60000
loss:
  dssim_weight: 0.2
  dssim_window: 11
  mode: mse_dssim
model:
  background: white
  capacity: 1000000
  geometry: surfel
  height: 800
  initial_splats: 100000
  sh_degree: 3
  width: 800
paths:
  data: ../data/materials_chrome
  init_ply: ../outputs/Oct30-1435-materials-chrome-audit/Oct30-1436-training-mask-init/initial.ply
  output: ../outputs/materials_chrome_hull_deferred_sh3/model.png
reporting:
  snapshot_every: 5000
runtime:
  arch: gpu
  seed: 7
sparse:
  enabled: false
  samples_per_tile: 256
surfel:
  foreground_pruning:
    enabled: true
  environment_height: 256
  environment_lr: 0.01
  environment_width: 512
  initial_reflection: 0.5
  mode: deferred
  depth_mode: ray_plane
  reflection_lr: 0.01
  save_debug: true
  sh_band_interval: 2000
  sh_start_iteration: 20001
  specular_start_iteration: 1
geometry_loss:
  normal_depth_weight: 0.01
  normal_start_iteration: 1
  normal_ramp_iterations: 2000
training:
  iterations: 30000
